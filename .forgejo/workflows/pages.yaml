name: pages

on:
  push:
    branches:
      - trunk

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    runs-on: atlas-nix-trusted
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: nix build .#site
      - name: Validate Pages domain
        run: |
          nix build .#site --no-link --out-link result-pages-site
          test -f result-pages-site/.domains
          grep -qx nix-article.tartanoglu.com result-pages-site/.domains
      - name: Deploy to Codeberg Pages
        env:
          GIT_AUTHOR_NAME: forgejo-actions
          GIT_AUTHOR_EMAIL: forgejo-actions@noreply.codeberg.org
          DEPLOY_REMOTE: pages-origin
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          git remote add pages-origin https://caniko:${CODEBERG_TOKEN}@codeberg.org/caniko/nix-article
          nix run .#deploy-pages
