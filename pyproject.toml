[project]
name = "anx-plot"
version = "0.1.0"
description = "Figure generation infrastructure for the anx article toolchain"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1",
    "numpy>=2,<3",
    "typer>=0.15,<1",
    "pydantic>=2,<3",
    "pycairo>=1.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/src/anx_plot"]

[project.scripts]
anx-plot = "anx_plot.cli:app"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
