[flake]
backend = "rust-crane"

[prebuild]
publish_attic = true
attic_app = ".#push-flake-inputs"

[prebuild.system_runners]
"x86_64-linux" = "ubuntu-24.04"

[ci]
runtime = "nix"
runner = "codefloe-global"
with_nextest = true
with_audit = true
with_deny = true
with_docs = true
provider = "crow"
platform = "forgejo"
workspace = true

[ci.pages]
repo = "caniko/nix-article"
canonical_domain = "nix-article.tartanoglu.com"
token_secret = "CODEBERG_TOKEN"

[release.attic]
cache = "canix"
url = "https://attic.candee.baby"
token_name = "nix-article"
token_secret = "ATTIC_TOKEN"
